<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>AURA AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at center,
            #18245a 0%,
            #090d20 35%,
            #02040a 80%
        );

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;
}


/* =========================================================
   APP
========================================================= */

.app {

    width: 100%;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    position: relative;

    padding: 25px;
}


/* =========================================================
   BRAND
========================================================= */

.logo {

    position: absolute;

    top: 30px;

    font-size: 27px;

    font-weight: 700;

    letter-spacing: 4px;

    text-shadow:
        0 0 15px #4d7cff,
        0 0 35px #3155ff;
}


.by {

    position: absolute;

    top: 68px;

    font-size: 12px;

    opacity: .55;

    letter-spacing: 1px;
}


/* =========================================================
   VOICE ORB
========================================================= */

.orb-wrapper {

    width: 320px;

    height: 320px;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;
}


/* OUTER RINGS */

.ring {

    position: absolute;

    border-radius: 50%;

    border: 1px solid
        rgba(90, 130, 255, .25);

    width: 230px;

    height: 230px;

    opacity: .6;
}

.ring2 {

    width: 270px;

    height: 270px;

    opacity: .35;
}


/* MAIN ORB */

.orb {

    width: 185px;

    height: 185px;

    border-radius: 50%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background:
        radial-gradient(
            circle at 35% 25%,
            #7da0ff,
            #405ff0 35%,
            #17215d 75%,
            #090d25
        );

    box-shadow:

        0 0 30px
        rgba(70, 110, 255, .85),

        0 0 80px
        rgba(50, 80, 255, .45),

        inset 0 0 30px
        rgba(255,255,255,.12);

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}


.mic {

    font-size: 43px;

    margin-bottom: 8px;
}


.state {

    font-size: 13px;

    opacity: .85;

    letter-spacing: .5px;
}


/* =========================================================
   LISTENING
========================================================= */

.listening .orb {

    animation:
        listenPulse 1.5s infinite ease-in-out;
}

.listening .ring {

    animation:
        ringPulse 2s infinite ease-in-out;
}


@keyframes listenPulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.07);
    }

    100% {
        transform: scale(1);
    }
}


@keyframes ringPulse {

    0% {
        transform: scale(.92);
        opacity: .25;
    }

    50% {
        transform: scale(1.05);
        opacity: .7;
    }

    100% {
        transform: scale(.92);
        opacity: .25;
    }
}


/* =========================================================
   THINKING
========================================================= */

.thinking .orb {

    animation:
        thinkingPulse .7s infinite alternate;

    box-shadow:

        0 0 45px
        rgba(170, 90, 255, .9),

        0 0 110px
        rgba(140, 70, 255, .45);
}


@keyframes thinkingPulse {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.12);
    }
}


/* =========================================================
   SPEAKING
========================================================= */

.speaking .orb {

    animation:
        speakingPulse .4s infinite alternate;

    box-shadow:

        0 0 50px
        rgba(40, 220, 255, .95),

        0 0 120px
        rgba(30, 180, 255, .5);
}


@keyframes speakingPulse {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.15);
    }
}


/* =========================================================
   STATUS
========================================================= */

.status {

    margin-top: 25px;

    font-size: 18px;

    opacity: .9;

    text-align: center;
}


.hint {

    margin-top: 10px;

    font-size: 13px;

    opacity: .4;

    text-align: center;
}


/* =========================================================
   RESPONSE
========================================================= */

.response {

    width: 90%;

    max-width: 650px;

    min-height: 25px;

    margin-top: 22px;

    text-align: center;

    font-size: 16px;

    line-height: 1.5;

    opacity: .9;

    max-height: 120px;

    overflow-y: auto;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 600px) {

    .orb-wrapper {

        width: 270px;

        height: 270px;
    }

    .orb {

        width: 155px;

        height: 155px;
    }

    .ring {

        width: 195px;

        height: 195px;
    }

    .ring2 {

        width: 230px;

        height: 230px;
    }

    .mic {

        font-size: 35px;
    }

    .logo {

        font-size: 23px;
    }
}

</style>

</head>

<body>

<div class="app">

```
<div class="logo">
    AURA AI
</div>


<div class="by">
    AI Assistant • by JLPG
</div>


<!-- =====================================================
     VOICE ORB
====================================================== -->

<div
    id="orbWrapper"
    class="orb-wrapper listening"
>

    <div class="ring"></div>

    <div class="ring ring2"></div>


    <div class="orb">

        <div class="mic">
            🎙️
        </div>

        <div
            id="state"
            class="state"
        >
            Listening
        </div>

    </div>

</div>


<div
    id="status"
    class="status"
>
    Listening...
</div>


<div class="hint">
    Speak naturally — no button required
</div>


<div
    id="response"
    class="response"
></div>
```

</div>

<script>

/* ============================================================
   ELEMENTS
============================================================ */

const orbWrapper =
    document.getElementById(
        "orbWrapper"
    );

const state =
    document.getElementById(
        "state"
    );

const status =
    document.getElementById(
        "status"
    );

const responseBox =
    document.getElementById(
        "response"
    );


/* ============================================================
   SPEECH RECOGNITION
============================================================ */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let speaking = false;

let thinking = false;

let restarting = false;


/* ============================================================
   CHECK SUPPORT
============================================================ */

if (!SpeechRecognition) {

    setState(
        "thinking",
        "Unsupported"
    );

    status.innerText =
        "Voice recognition is not supported in this browser.";

} else {

    setupRecognition();

}


/* ============================================================
   SETUP
============================================================ */

function setupRecognition() {

    recognition =
        new SpeechRecognition();


    recognition.continuous = false;

    recognition.interimResults = false;

    /*
       en-IN allows natural Indian English/Hinglish
       recognition in many browsers.
    */

    recognition.lang = "en-IN";


    /* ---------------------------------------------------------
       START
    --------------------------------------------------------- */

    recognition.onstart = function() {

        restarting = false;

        if (speaking || thinking)
            return;

        setState(
            "listening",
            "Listening"
        );

        status.innerText =
            "Listening...";

    };


    /* ---------------------------------------------------------
       RESULT
    --------------------------------------------------------- */

    recognition.onresult =
        async function(event) {

            if (speaking)
                return;


            const transcript =
                event
                .results[0][0]
                .transcript
                .trim();


            if (!transcript)
                return;


            console.log(
                "User:",
                transcript
            );


            thinking = true;

            stopRecognition();


            setState(
                "thinking",
                "Thinking"
            );

            status.innerText =
                "Thinking...";


            await askAI(
                transcript
            );

        };


    /* ---------------------------------------------------------
       END
    --------------------------------------------------------- */

    recognition.onend =
        function() {

            if (
                !speaking &&
                !thinking
            ) {

                restartRecognition();

            }

        };


    /* ---------------------------------------------------------
       ERROR
    --------------------------------------------------------- */

    recognition.onerror =
        function(event) {

            console.log(
                "Recognition error:",
                event.error
            );


            if (
                event.error ===
                "not-allowed"
            ) {

                setState(
                    "thinking",
                    "Mic blocked"
                );

                status.innerText =
                    "Please allow microphone access.";

                return;

            }


            if (!speaking && !thinking) {

                restartRecognition();

            }

        };


    /*
       START AUTOMATICALLY
    */

    restartRecognition();

}


/* ============================================================
   START RECOGNITION
============================================================ */

function startRecognition() {

    if (!recognition)
        return;

    if (speaking || thinking)
        return;


    try {

        recognition.start();

    } catch (error) {

        /*
           Browser throws an error if recognition
           is already running.
        */

    }

}


/* ============================================================
   STOP
============================================================ */

function stopRecognition() {

    if (!recognition)
        return;


    try {

        recognition.stop();

    } catch (error) {}

}


/* ============================================================
   RESTART
============================================================ */

function restartRecognition() {

    if (restarting)
        return;

    if (speaking || thinking)
        return;


    restarting = true;


    setTimeout(
        function() {

            restarting = false;

            startRecognition();

        },
        600
    );

}


/* ============================================================
   ASK AI
============================================================ */

async function askAI(message) {

    try {

        const result =
            await fetch(
                "/api/chat",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                message
                        })

                }
            );


        const data =
            await result.json();


        if (!result.ok) {

            throw new Error(
                data.reply ||
                "AI request failed"
            );

        }


        const reply =
            data.reply ||
            "Sorry, I couldn't answer that.";


        responseBox.innerText =
            reply;


        thinking = false;


        speak(
            reply
        );


    } catch (error) {

        console.error(
            error
        );


        thinking = false;


        responseBox.innerText =
            "Sorry, something went wrong.";


        setState(
            "listening",
            "Listening"
        );


        status.innerText =
            "Listening again...";


        restartRecognition();

    }

}


/* ============================================================
   TEXT TO SPEECH
============================================================ */

function speak(text) {

    if (
        !window.speechSynthesis
    ) {

        speaking = false;

        restartRecognition();

        return;

    }


    stopRecognition();


    window.speechSynthesis.cancel();


    speaking = true;


    setState(
        "speaking",
        "Speaking"
    );


    status.innerText =
        "AURA AI is speaking...";


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    /*
       Natural speech settings.
    */

    utterance.rate = 1.0;

    utterance.pitch = 1.0;

    utterance.volume = 1.0;


    /*
       Try to choose an Indian English voice
       when available.
    */

    const voices =
        window.speechSynthesis
            .getVoices();


    const preferredVoice =
        voices.find(
            voice =>
                voice.lang ===
                "en-IN"
        );


    if (preferredVoice) {

        utterance.voice =
            preferredVoice;

    }


    /* ---------------------------------------------------------
       SPEECH FINISHED
    --------------------------------------------------------- */

    utterance.onend =
        function() {

            speaking = false;


            setState(
                "listening",
                "Listening"
            );


            status.innerText =
                "Listening again...";


            /*
               Automatically start listening again.
            */

            restartRecognition();

        };


    /* ---------------------------------------------------------
       SPEECH ERROR
    --------------------------------------------------------- */

    utterance.onerror =
        function() {

            speaking = false;


            setState(
                "listening",
                "Listening"
            );


            status.innerText =
                "Listening again...";


            restartRecognition();

        };


    window.speechSynthesis.speak(
        utterance
    );

}


/* ============================================================
   UI STATE
============================================================ */

function setState(
    mode,
    text
) {

    orbWrapper.className =
        "orb-wrapper " +
        mode;


    state.innerText =
        text;

}


/* ============================================================
   LOAD VOICES
============================================================ */

if (
    window.speechSynthesis
) {

    window.speechSynthesis
        .onvoiceschanged =
        function() {

            window.speechSynthesis
                .getVoices();

        };

}

</script>

</body>

</html>
