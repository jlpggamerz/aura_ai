<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AURA AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #182848 0%, #090b14 45%, #030409 100%);
            color: white;
            overflow-x: hidden;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        header {
            width: 100%;
            padding: 20px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.15);
            backdrop-filter: blur(12px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d9ff, #6c4cff);
            box-shadow: 0 0 25px rgba(0,217,255,0.35);
        }

        .brand h1 {
            font-size: 21px;
            letter-spacing: 1px;
        }

        .brand p {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 3px;
        }

        .online {
            font-size: 12px;
            color: #6fffc1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: #00ff9d;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ff9d;
        }

        /* MAIN */

        main {
            flex: 1;
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 35px 20px 25px;
            display: flex;
            flex-direction: column;
        }

        /* VOICE AREA */

        .voice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0 30px;
        }

        .orb-container {
            position: relative;
            width: 190px;
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring {
            position: absolute;
            border: 1px solid rgba(0,217,255,0.25);
            border-radius: 50%;
            width: 170px;
            height: 170px;
            animation: rotate 8s linear infinite;
        }

        .ring.two {
            width: 205px;
            height: 205px;
            border-color: rgba(108,76,255,0.20);
            animation-duration: 12s;
            animation-direction: reverse;
        }

        .orb {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            background: radial-gradient(circle at 35% 30%, #51eaff, #1760ff 45%, #241060 100%);
            box-shadow:
                0 0 30px rgba(0,217,255,0.55),
                0 0 80px rgba(58,75,255,0.35);
            transition: 0.3s;
        }

        .orb.listening {
            animation: listening 1.4s infinite;
        }

        .orb.thinking {
            animation: thinking 0.8s infinite;
            background: radial-gradient(circle at 35% 30%, #d19cff, #713cff 50%, #190b45 100%);
        }

        .orb.speaking {
            animation: speaking 0.45s infinite alternate;
            background: radial-gradient(circle at 35% 30%, #8ffff1, #00a8ff 50%, #063c61 100%);
        }

        .orb.error {
            background: radial-gradient(circle at 35% 30%, #ff8c8c, #ff304f 50%, #4d0814 100%);
        }

        @keyframes listening {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
            }
        }

        @keyframes thinking {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 30px rgba(150,80,255,0.5);
            }
            50% {
                transform: scale(1.12);
                box-shadow: 0 0 65px rgba(150,80,255,0.9);
            }
        }

        @keyframes speaking {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.14);
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .state {
            margin-top: 15px;
            font-size: 16px;
            font-weight: 600;
        }

        .hint {
            margin-top: 6px;
            font-size: 12px;
            color: #8d96a8;
            text-align: center;
        }

        /* CHAT */

        .chat-container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .messages {
            width: 100%;
            min-height: 130px;
            max-height: 330px;
            overflow-y: auto;
            padding: 10px 5px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 82%;
            padding: 12px 15px;
            border-radius: 17px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #315cff, #673cff);
            border-bottom-right-radius: 5px;
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255,255,255,0.075);
            border: 1px solid rgba(255,255,255,0.08);
            border-bottom-left-radius: 5px;
        }

        .message.system {
            align-self: center;
            color: #8d96a8;
            font-size: 12px;
            background: transparent;
        }

        /* INPUT */

        .input-area {
            width: 100%;
            display: flex;
            gap: 10px;
            padding: 10px 0 5px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 18px;
            padding: 5px 6px 5px 15px;
            backdrop-filter: blur(10px);
        }

        #messageInput {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 14px;
            padding: 10px 5px;
        }

        #messageInput::placeholder {
            color: #7d8493;
        }

        button {
            border: none;
            cursor: pointer;
        }

        .send-btn {
            width: 48px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, #00cfff, #4d55ff);
            color: white;
            font-size: 19px;
            box-shadow: 0 0 18px rgba(0,180,255,0.25);
            transition: 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .mic-btn {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 18px;
            margin-right: 5px;
        }

        .mic-btn.active {
            background: rgba(0,210,255,0.25);
            box-shadow: 0 0 15px rgba(0,210,255,0.3);
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 15px;
            color: #626a79;
            font-size: 11px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 15px;
            }

            .brand h1 {
                font-size: 18px;
            }

            main {
                padding: 20px 13px 15px;
            }

            .voice-section {
                padding-top: 10px;
            }

            .orb-container {
                width: 155px;
                height: 155px;
            }

            .orb {
                width: 95px;
                height: 95px;
                font-size: 32px;
            }

            .ring {
                width: 145px;
                height: 145px;
            }

            .ring.two {
                width: 170px;
                height: 170px;
            }

            .messages {
                max-height: 280px;
            }

            .message {
                max-width: 90%;
            }

            .online {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header>
        <div class="logo-area">
            <div class="logo">A</div>

            <div class="brand">
                <h1>AURA AI</h1>
                <p>AI Assistant • by JLPG</p>
            </div>
        </div>

        <div class="online">
            <span class="online-dot"></span>
            Online
        </div>
    </header>


    <!-- MAIN -->

    <main>

        <!-- VOICE ORB -->

        <section class="voice-section">

            <div class="orb-container">

                <div class="ring"></div>
                <div class="ring two"></div>

                <div id="orb" class="orb listening">
                    🎙️
                </div>

            </div>

            <div id="state" class="state">
                Listening
            </div>

            <div id="hint" class="hint">
                Speak naturally — no button required
            </div>

        </section>


        <!-- CHAT -->

        <section class="chat-container">

            <div id="messages" class="messages">

                <div class="message ai">
                    Hey! I'm AURA AI. You can speak to me or type a message below.
                </div>

            </div>


            <!-- INPUT -->

            <div class="input-area">

                <div class="input-wrapper">

                    <input
                        id="messageInput"
                        type="text"
                        autocomplete="off"
                        placeholder="Type your message..."
                    >

                    <button
                        id="micBtn"
                        class="mic-btn"
                        title="Voice listening"
                    >
                        🎙️
                    </button>

                </div>

                <button
                    id="sendBtn"
                    class="send-btn"
                    title="Send"
                >
                    ➤
                </button>

            </div>

        </section>

    </main>


    <footer>
        AURA AI • Powered by Groq • JLPG
    </footer>

</div>


<script>

    /* ==============================
       ELEMENTS
    ============================== */

    const orb = document.getElementById("orb");
    const stateText = document.getElementById("state");
    const hint = document.getElementById("hint");

    const messages = document.getElementById("messages");

    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");


    /* ==============================
       STATE
    ============================== */

    let recognition = null;

    let speaking = false;
    let thinking = false;
    let listening = false;

    let autoListening = true;
    let restarting = false;


    /* ==============================
       UI STATE
    ============================== */

    function setState(type, text) {

        orb.classList.remove(
            "listening",
            "thinking",
            "speaking",
            "error"
        );

        orb.classList.add(type);

        stateText.textContent = text;

        if (type === "listening") {
            orb.textContent = "🎙️";
        }

        else if (type === "thinking") {
            orb.textContent = "🧠";
        }

        else if (type === "speaking") {
            orb.textContent = "🔊";
        }

        else {
            orb.textContent = "⚠️";
        }
    }


    /* ==============================
       ADD MESSAGE
    ============================== */

    function addMessage(text, type) {

        const message = document.createElement("div");

        message.className = "message " + type;

        message.textContent = text;

        messages.appendChild(message);

        messages.scrollTop = messages.scrollHeight;

        return message;
    }


    /* ==============================
       SEND MESSAGE TO GROQ
    ============================== */

    async function askAI(message) {

        if (!message || thinking) {
            return;
        }

        thinking = true;

        stopRecognition();

        setState("thinking", "Thinking");

        const userMessage = addMessage(message, "user");

        try {

            const response = await fetch("/api/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })

            });


            const data = await response.json();


            if (!response.ok) {
                throw new Error(
                    data.reply || "AI request failed"
                );
            }


            const reply =
                data.reply ||
                "Sorry, I couldn't answer that.";


            addMessage(reply, "ai");


            thinking = false;

            speak(reply);

        }

        catch (error) {

            console.error("AURA AI ERROR:", error);

            thinking = false;

            addMessage(
                "Sorry, something went wrong. Please try again.",
                "ai"
            );

            setState("listening", "Listening");

            restartRecognition();
        }
    }


    /* ==============================
       CHAT SEND
    ============================== */

    async function sendChat() {

        const message =
            messageInput.value.trim();

        if (!message) {
            return;
        }

        messageInput.value = "";

        await askAI(message);
    }


    sendBtn.addEventListener(
        "click",
        sendChat
    );


    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendChat();
            }

        }
    );


    /* ==============================
       TEXT TO SPEECH
    ============================== */

    function speak(text) {

        if (!window.speechSynthesis) {

            speaking = false;

            setState(
                "listening",
                "Listening"
            );

            restartRecognition();

            return;
        }


        stopRecognition();

        window.speechSynthesis.cancel();

        speaking = true;

        setState(
            "speaking",
            "Speaking"
        );

        hint.textContent =
            "AURA AI is speaking...";


        const utterance =
            new SpeechSynthesisUtterance(text);


        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;


        /*
           Choose Hindi voice when
           response contains Devanagari.
        */

        const voices =
            window.speechSynthesis.getVoices();


        const hasHindi =
            /[\u0900-\u097F]/.test(text);


        let preferredVoice;


        if (hasHindi) {

            preferredVoice =
                voices.find(
                    voice =>
                        voice.lang
                            .toLowerCase()
                            .startsWith("hi")
                );

        } else {

            preferredVoice =
                voices.find(
                    voice =>
                        voice.lang
                            .toLowerCase()
                            .startsWith("en-in")
                );

            if (!preferredVoice) {

                preferredVoice =
                    voices.find(
                        voice =>
                            voice.lang
                                .toLowerCase()
                                .startsWith("en")
                    );
            }
        }


        if (preferredVoice) {

            utterance.voice =
                preferredVoice;
        }


        utterance.onend = function() {

            speaking = false;

            hint.textContent =
                "Speak naturally — no button required";

            setState(
                "listening",
                "Listening"
            );

            restartRecognition();
        };


        utterance.onerror = function() {

            speaking = false;

            setState(
                "listening",
                "Listening"
            );

            restartRecognition();
        };


        window.speechSynthesis.speak(
            utterance
        );
    }


    /* ==============================
       SPEECH RECOGNITION
    ============================== */

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    function setupRecognition() {

        if (!SpeechRecognition) {

            setState(
                "error",
                "Voice unavailable"
            );

            hint.textContent =
                "Use Google Chrome or Microsoft Edge for voice.";

            micBtn.disabled = true;

            return;
        }


        recognition =
            new SpeechRecognition();


        recognition.continuous = false;

        recognition.interimResults = false;

        /*
           en-IN works reasonably well
           for Indian English and Hinglish.
        */

        recognition.lang = "en-IN";


        recognition.onstart = function() {

            if (speaking || thinking) {
                return;
            }

            listening = true;

            micBtn.classList.add("active");

            setState(
                "listening",
                "Listening"
            );

            hint.textContent =
                "I'm listening...";
        };


        recognition.onresult = async function(event) {

            if (speaking || thinking) {
                return;
            }


            const transcript =
                event.results[0][0]
                    .transcript
                    .trim();


            if (!transcript) {
                return;
            }


            listening = false;

            micBtn.classList.remove("active");

            await askAI(transcript);
        };


        recognition.onend = function() {

            listening = false;

            micBtn.classList.remove("active");


            if (
                autoListening &&
                !speaking &&
                !thinking
            ) {

                restartRecognition();
            }
        };


        recognition.onerror = function(event) {

            console.log(
                "Speech error:",
                event.error
            );


            listening = false;

            micBtn.classList.remove("active");


            if (event.error === "not-allowed") {

                setState(
                    "error",
                    "Mic blocked"
                );

                hint.textContent =
                    "Allow microphone permission in your browser.";

                autoListening = false;

                return;
            }


            if (
                autoListening &&
                !speaking &&
                !thinking
            ) {

                restartRecognition();
            }
        };
    }


    /* ==============================
       START RECOGNITION
    ============================== */

    function startRecognition() {

        if (
            !recognition ||
            speaking ||
            thinking ||
            listening ||
            !autoListening
        ) {
            return;
        }


        try {

            recognition.start();

        }

        catch (error) {

            console.log(
                "Recognition start:",
                error
            );
        }
    }


    /* ==============================
       STOP RECOGNITION
    ============================== */

    function stopRecognition() {

        if (!recognition) {
            return;
        }


        try {

            recognition.stop();

        }

        catch (error) {}
    }


    /* ==============================
       AUTO RESTART
    ============================== */

    function restartRecognition() {

        if (
            restarting ||
            speaking ||
            thinking ||
            !autoListening
        ) {
            return;
        }


        restarting = true;


        setTimeout(function() {

            restarting = false;

            startRecognition();

        }, 700);
    }


    /* ==============================
       MIC BUTTON
    ============================== */

    micBtn.addEventListener(
        "click",
        function() {

            if (!recognition) {
                return;
            }


            if (listening) {

                autoListening = false;

                stopRecognition();

                listening = false;

                micBtn.classList.remove(
                    "active"
                );

                setState(
                    "listening",
                    "Voice paused"
                );

                hint.textContent =
                    "Press the mic again to resume.";

            }

            else {

                autoListening = true;

                startRecognition();
            }

        }
    );


    /* ==============================
       LOAD VOICES
    ============================== */

    if (window.speechSynthesis) {

        window.speechSynthesis.onvoiceschanged =
            function() {

                window.speechSynthesis
                    .getVoices();

            };
    }


    /* ==============================
       INITIALIZE
    ============================== */

    setupRecognition();


    /*
       Start voice automatically.

       Some browsers may require the
       first microphone permission/user
       interaction before this works.
    */

    setTimeout(function() {

        startRecognition();

    }, 1000);

</script>

</body>
</html>
