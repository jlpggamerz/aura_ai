<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AURA AI — Made by JLPG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #08080c;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 75px;
            background: #111116;
            border-bottom: 1px solid #292930;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 46px;
            height: 46px;

            border-radius: 13px;

            background: linear-gradient(
                135deg,
                #ffffff,
                #777777
            );

            color: #000;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
            font-weight: bold;

            box-shadow: 0 0 18px rgba(255,255,255,0.12);
        }

        .brand-text h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .brand-text p {
            margin: 3px 0 0;
            color: #777;
            font-size: 12px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;

            color: #65e572;
            font-size: 13px;
            font-weight: bold;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;

            background: #65e572;

            box-shadow:
                0 0 8px #65e572,
                0 0 15px rgba(101,229,114,0.4);
        }

        /* =========================
           CHAT
        ========================= */

        .chat {
            flex: 1;

            overflow-y: auto;

            padding: 25px;

            display: flex;
            flex-direction: column;

            gap: 15px;

            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;

            padding: 13px 16px;

            border-radius: 15px;

            line-height: 1.5;

            white-space: pre-wrap;

            word-wrap: break-word;

            animation: messageIn 0.2s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user {
            align-self: flex-end;

            background: #ffffff;

            color: #000000;

            border-bottom-right-radius: 4px;
        }

        .ai {
            align-self: flex-start;

            background: #18181f;

            border: 1px solid #2b2b35;

            color: #ffffff;

            border-bottom-left-radius: 4px;
        }

        .message-name {
            font-size: 10px;

            opacity: 0.55;

            margin-bottom: 5px;

            font-weight: bold;

            letter-spacing: 0.5px;
        }

        /* =========================
           TYPING
        ========================= */

        .typing {
            display: none;

            align-self: flex-start;

            padding: 10px 15px;

            color: #999;

            font-size: 13px;
        }

        /* =========================
           QUICK COMMANDS
        ========================= */

        .quick {
            display: flex;

            gap: 8px;

            padding: 10px 20px;

            overflow-x: auto;
        }

        .quick button {
            flex-shrink: 0;

            background: #17171d;

            color: #ddd;

            border: 1px solid #2c2c35;

            border-radius: 20px;

            padding: 8px 13px;

            cursor: pointer;

            transition: 0.2s;
        }

        .quick button:hover {
            background: #292932;

            border-color: #555;
        }

        /* =========================
           INPUT AREA
        ========================= */

        .input-area {
            padding: 12px 20px 5px;

            background: #0f0f14;

            border-top: 1px solid #292930;
        }

        .input-box {
            display: flex;

            align-items: center;

            gap: 8px;

            max-width: 1000px;

            margin: auto;

            background: #18181f;

            border: 1px solid #30303a;

            border-radius: 16px;

            padding: 8px;

            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
        }

        #messageInput {
            flex: 1;

            min-width: 0;

            background: transparent;

            color: white;

            border: none;

            outline: none;

            padding: 12px;

            font-size: 15px;
        }

        #messageInput::placeholder {
            color: #777;
        }

        .icon-button {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            border: none;

            border-radius: 12px;

            background: #24242c;

            color: white;

            cursor: pointer;

            font-size: 19px;

            transition: 0.2s;
        }

        .icon-button:hover {
            background: #33333d;
        }

        .send-button {
            width: 80px;
            height: 45px;

            flex-shrink: 0;

            border: none;

            border-radius: 12px;

            background: white;

            color: black;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .send-button:hover {
            background: #ddd;
        }

        .send-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        /* =========================
           MIC ACTIVE
        ========================= */

        .mic-active {
            background: white !important;

            color: black !important;

            box-shadow: 0 0 15px rgba(255,255,255,0.25);
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            padding: 7px 10px 9px;

            color: #666;

            font-size: 11px;

            background: #0f0f14;
        }

        .footer strong {
            color: #aaa;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                height: 65px;

                padding: 0 15px;
            }

            .logo {
                width: 40px;
                height: 40px;
            }

            .brand-text h1 {
                font-size: 18px;
            }

            .brand-text p {
                font-size: 10px;
            }

            .status {
                font-size: 10px;
            }

            .chat {
                padding: 15px;
            }

            .message {
                max-width: 90%;
            }

            .quick {
                padding: 8px 12px;
            }

            .input-area {
                padding: 8px 10px 4px;
            }

            .input-box {
                padding: 6px;
            }

            #messageInput {
                padding: 10px 6px;

                font-size: 14px;
            }

            .icon-button {
                width: 42px;
                height: 42px;
            }

            .send-button {
                width: 58px;
                height: 42px;

                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="brand">

            <div class="logo">
                A
            </div>

            <div class="brand-text">

                <h1>AURA AI</h1>

                <p>
                    Personal AI Assistant
                </p>

            </div>

        </div>

        <div class="status">

            <span class="status-dot"></span>

            ONLINE

        </div>

    </header>


    <!-- =========================
         CHAT
    ========================== -->

    <main
        class="chat"
        id="chat"
    >

        <div class="message ai">

            <div class="message-name">
                AURA AI
            </div>

            Hello! 👋

            Main AURA AI hoon.

            Tum mujhse English, Hindi ya Hinglish mein baat kar sakte ho.

            🎤 Mic button se bolo aur 🔊 AURA ka answer suno.

        </div>

        <div
            class="typing"
            id="typing"
        >
            AURA AI is thinking...
        </div>

    </main>


    <!-- =========================
         QUICK COMMANDS
    ========================== -->

    <div class="quick">

        <button data-message="Hello AURA AI">
            Hello
        </button>

        <button data-message="Kya haal hai?">
            Kya haal hai?
        </button>

        <button data-message="Python kya hai?">
            Python
        </button>

        <button data-message="Class 9 ke liye photosynthesis explain karo">
            Class 9
        </button>

    </div>


    <!-- =========================
         INPUT
    ========================== -->

    <div class="input-area">

        <div class="input-box">

            <!-- MIC -->

            <button
                class="icon-button"
                id="micButton"
                title="Voice input"
                aria-label="Voice input"
            >
                🎤
            </button>


            <!-- TEXT -->

            <input
                id="messageInput"
                type="text"
                autocomplete="off"
                placeholder="Type or speak to AURA AI..."
            >


            <!-- SPEAKER -->

            <button
                class="icon-button"
                id="speakerButton"
                title="Stop speaking"
                aria-label="Stop speaking"
            >
                🔊
            </button>


            <!-- SEND -->

            <button
                class="send-button"
                id="sendButton"
            >
                SEND
            </button>

        </div>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        AURA AI
        <strong>• Made by JLPG</strong>

    </footer>

</div>


<script>

    // =========================================
    // ELEMENTS
    // =========================================

    const chat =
        document.getElementById("chat");

    const input =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const micButton =
        document.getElementById("micButton");

    const speakerButton =
        document.getElementById("speakerButton");

    const typing =
        document.getElementById("typing");


    // =========================================
    // ADD MESSAGE
    // =========================================

    function addMessage(text, type) {

        const message =
            document.createElement("div");

        message.className =
            "message " + type;


        const name =
            document.createElement("div");

        name.className =
            "message-name";

        name.textContent =
            type === "user"
                ? "YOU"
                : "AURA AI";


        const content =
            document.createElement("div");

        content.textContent =
            text;


        message.appendChild(name);

        message.appendChild(content);


        chat.insertBefore(
            message,
            typing
        );


        chat.scrollTop =
            chat.scrollHeight;
    }


    // =========================================
    // SEND MESSAGE
    // =========================================

    async function sendMessage(customMessage = null) {

        const message =
            customMessage !== null
                ? customMessage.trim()
                : input.value.trim();


        if (!message) {
            return;
        }


        addMessage(
            message,
            "user"
        );


        input.value = "";


        typing.style.display =
            "block";


        chat.scrollTop =
            chat.scrollHeight;


        sendButton.disabled =
            true;


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })
                    }
                );


            const data =
                await response.json();


            typing.style.display =
                "none";


            const answer =
                data.response ||
                "AURA AI ne koi response nahi diya.";


            addMessage(
                answer,
                "ai"
            );


            // Speak AI response
            speakText(answer);


        } catch (error) {

            console.error(
                "Connection error:",
                error
            );


            typing.style.display =
                "none";


            addMessage(
                "Connection error. Check whether web_app.py is running.",
                "ai"
            );

        } finally {

            sendButton.disabled =
                false;

            input.focus();
        }
    }


    // =========================================
    // SEND BUTTON
    // =========================================

    sendButton.addEventListener(
        "click",
        function () {

            sendMessage();

        }
    );


    // =========================================
    // ENTER KEY
    // =========================================

    input.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    // =========================================
    // QUICK BUTTONS
    // =========================================

    document
        .querySelectorAll("[data-message]")
        .forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        const message =
                            button.dataset.message;

                        sendMessage(message);

                    }
                );

            }
        );


    // =========================================
    // TEXT TO SPEECH
    // =========================================

    let currentSpeech = null;


    function speakText(text) {

        if (
            !("speechSynthesis" in window)
        ) {

            console.log(
                "Text to speech is not supported."
            );

            return;
        }


        window.speechSynthesis.cancel();


        const cleanText =
            text
                .replace(/[*#_`]/g, "")
                .replace(/\n+/g, ". ");


        currentSpeech =
            new SpeechSynthesisUtterance(
                cleanText
            );


        currentSpeech.rate =
            1;

        currentSpeech.pitch =
            1;

        currentSpeech.volume =
            1;


        /*
         * Indian English voice.
         * Browser available voices decide
         * the actual voice.
         */

        currentSpeech.lang =
            "en-IN";


        window.speechSynthesis.speak(
            currentSpeech
        );
    }


    // =========================================
    // STOP SPEAKER
    // =========================================

    speakerButton.addEventListener(
        "click",
        function () {

            if (
                "speechSynthesis" in window
            ) {

                window.speechSynthesis.cancel();

            }

        }
    );


    // =========================================
    // SPEECH RECOGNITION
    // =========================================

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    let recognition = null;

    let isListening = false;


    if (SpeechRecognition) {

        recognition =
            new SpeechRecognition();


        recognition.continuous =
            false;


        recognition.interimResults =
            false;


        /*
         * English + Indian accent.
         * Change to hi-IN if you mainly
         * want Hindi recognition.
         */

        recognition.lang =
            "en-IN";


        // -------------------------------
        // START
        // -------------------------------

        recognition.onstart =
            function () {

                isListening =
                    true;


                micButton.classList.add(
                    "mic-active"
                );


                micButton.textContent =
                    "🔴";


                input.placeholder =
                    "Listening... bolo...";

            };


        // -------------------------------
        // RESULT
        // -------------------------------

        recognition.onresult =
            function (event) {

                const transcript =
                    event
                        .results[0][0]
                        .transcript;


                input.value =
                    transcript;


                sendMessage();

            };


        // -------------------------------
        // ERROR
        // -------------------------------

        recognition.onerror =
            function (event) {

                console.log(
                    "Voice error:",
                    event.error
                );


                input.placeholder =
                    "Type or speak to AURA AI...";

            };


        // -------------------------------
        // END
        // -------------------------------

        recognition.onend =
            function () {

                isListening =
                    false;


                micButton.classList.remove(
                    "mic-active"
                );


                micButton.textContent =
                    "🎤";


                input.placeholder =
                    "Type or speak to AURA AI...";

            };


        // -------------------------------
        // MIC BUTTON
        // -------------------------------

        micButton.addEventListener(
            "click",
            function () {

                if (isListening) {

                    recognition.stop();

                } else {

                    /*
                     * Stop any existing speech
                     * before listening.
                     */

                    if (
                        "speechSynthesis"
                        in window
                    ) {

                        window.speechSynthesis.cancel();

                    }


                    try {

                        recognition.start();

                    } catch (error) {

                        console.log(
                            "Microphone start error:",
                            error
                        );

                    }

                }

            }
        );

    } else {

        /*
         * Browser doesn't support
         * Speech Recognition.
         */

        micButton.addEventListener(
            "click",
            function () {

                alert(
                    "Voice input is not supported in this browser. Try Google Chrome or Microsoft Edge."
                );

            }
        );

    }


    // =========================================
    // STARTUP
    // =========================================

    input.focus();

</script>

</body>
</html>
