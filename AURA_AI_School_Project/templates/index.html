<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AURA AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 50% 20%, #17234d 0%, transparent 35%),
                radial-gradient(circle at 85% 85%, #28104c 0%, transparent 35%),
                #050711;
            color: white;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            width: 250px;
            padding: 22px 16px;
            background: rgba(7, 9, 20, 0.92);
            border-right: 1px solid rgba(255,255,255,.07);
            display: flex;
            flex-direction: column;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .brand img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand-sub {
            margin-top: 3px;
            color: #777f9c;
            font-size: 10px;
        }

        .menu-title {
            margin: 0 0 10px 10px;
            color: #68708b;
            font-size: 10px;
            text-transform: uppercase;
        }

        .menu-btn {
            width: 100%;
            border: none;
            background: transparent;
            color: #aab2ce;
            text-align: left;
            padding: 13px 14px;
            margin-bottom: 5px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
        }

        .menu-btn:hover,
        .menu-btn.active {
            background: rgba(77, 100, 255, .15);
            color: white;
        }

        .sidebar-bottom {
            margin-top: auto;
            padding: 10px;
            color: #626a84;
            font-size: 11px;
            line-height: 1.7;
        }

        .jlpg {
            color: #b7c0dd;
            font-weight: 600;
        }

        /* ================= MAIN ================= */

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 75px;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5,7,17,.5);
            border-bottom: 1px solid rgba(255,255,255,.07);
            backdrop-filter: blur(15px);
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #9ba4c1;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #35e58b;
            box-shadow: 0 0 12px #35e58b;
        }

        /* ================= CONTENT ================= */

        .content {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        /* ================= ASSISTANT ================= */

        .assistant-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .orb-wrapper {
            width: 270px;
            height: 270px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 20px;
        }

        .orb-ring {
            position: absolute;
            width: 235px;
            height: 235px;
            border-radius: 50%;
            border: 1px solid rgba(92,120,255,.28);
            animation: rotate 8s linear infinite;
        }

        .orb-ring::before,
        .orb-ring::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6681ff;
            box-shadow: 0 0 18px #6681ff;
        }

        .orb-ring::before {
            top: 15px;
            left: 40px;
        }

        .orb-ring::after {
            right: 35px;
            bottom: 20px;
        }

        .orb {
            width: 155px;
            height: 155px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #9aa8ff,
                    transparent 28%
                ),
                radial-gradient(
                    circle,
                    #354eff 0%,
                    #18216e 55%,
                    #090b1c 100%
                );

            box-shadow:
                0 0 40px rgba(78,105,255,.7),
                0 0 100px rgba(78,55,255,.3),
                inset 0 0 35px rgba(255,255,255,.08);

            animation: float 3s ease-in-out infinite;
            transition: .3s;
        }

        .orb img {
            width: 78px;
            height: 78px;
            object-fit: contain;
        }

        .orb.listening {
            animation:
                float 3s ease-in-out infinite,
                listening 1.2s ease-in-out infinite;
        }

        .orb.thinking {
            animation:
                float 3s ease-in-out infinite,
                thinking 1s ease-in-out infinite;
        }

        .orb.speaking {
            animation:
                float 3s ease-in-out infinite,
                speaking .65s ease-in-out infinite;
        }

        .state {
            color: #b2bad5;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .hint {
            color: #626b87;
            font-size: 12px;
            text-align: center;
        }

        /* ================= CHAT ================= */

        .chat-panel {
            width: 400px;
            display: flex;
            flex-direction: column;
            background: rgba(7,9,20,.75);
            border-left: 1px solid rgba(255,255,255,.07);
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        .chat-header h2 {
            font-size: 16px;
        }

        .chat-header p {
            color: #69718c;
            font-size: 11px;
            margin-top: 4px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
        }

        .message {
            max-width: 88%;
            padding: 11px 13px;
            margin-bottom: 12px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message.ai {
            background: #11162b;
            color: #dce1f2;
            border: 1px solid rgba(255,255,255,.05);
        }

        .message.user {
            margin-left: auto;
            background: linear-gradient(
                135deg,
                #5368ff,
                #763cff
            );
            color: white;
        }

        /* ================= INPUT ================= */

        .input-area {
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,.07);
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px;
            background: #0e1224;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 14px;
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 13px;
        }

        #messageInput::placeholder {
            color: #5e6680;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 11px;
            background: #171d38;
            color: #b0b8d5;
            cursor: pointer;
            font-size: 16px;
        }

        .icon-btn:hover {
            background: #252d54;
            color: white;
        }

        .send-btn {
            background: linear-gradient(
                135deg,
                #5368ff,
                #763cff
            );
            color: white;
        }

        /* ================= MOBILE ================= */

        @media(max-width: 850px) {

            body {
                overflow: auto;
            }

            .sidebar {
                display: none;
            }

            .content {
                flex-direction: column;
            }

            .assistant-area {
                min-height: 46vh;
            }

            .chat-panel {
                width: 100%;
                height: 54vh;
                border-left: none;
                border-top: 1px solid rgba(255,255,255,.07);
            }

            .orb-wrapper {
                width: 190px;
                height: 190px;
            }

            .orb-ring {
                width: 170px;
                height: 170px;
            }

            .orb {
                width: 115px;
                height: 115px;
            }

            .orb img {
                width: 58px;
                height: 58px;
            }

            .topbar {
                padding: 0 18px;
            }
        }

        /* ================= ANIMATIONS ================= */

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes float {
            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes listening {
            0%,100% {
                box-shadow:
                    0 0 35px rgba(77,103,255,.65),
                    0 0 80px rgba(50,100,255,.2);
            }

            50% {
                box-shadow:
                    0 0 60px rgba(77,140,255,.95),
                    0 0 130px rgba(50,100,255,.4);
            }
        }

        @keyframes thinking {
            0%,100% {
                filter: hue-rotate(0deg);
            }

            50% {
                filter: hue-rotate(45deg);
            }
        }

        @keyframes speaking {
            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <img
                src="{{ url_for('static', filename='aura-logo.png') }}"
                alt="AURA AI"
            >

            <div>
                <div class="brand-name">
                    AURA AI
                </div>

                <div class="brand-sub">
                    YOUR AI ASSISTANT
                </div>
            </div>

        </div>


        <div class="menu-title">
            Workspace
        </div>


        <button
            class="menu-btn active"
            onclick="focusChat()"
        >
            ✦ Assistant
        </button>


        <button
            class="menu-btn"
            onclick="newChat()"
        >
            ＋ New Chat
        </button>


        <button
            class="menu-btn"
            onclick="toggleVoice()"
        >
            ◉ Voice Mode
        </button>


        <div class="sidebar-bottom">

            <div>
                AURA AI
            </div>

            <strong class="jlpg">
                Made by JLPG
            </strong>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <div class="page-title">
                AURA Assistant
            </div>


            <div class="status">

                <span class="status-dot"></span>

                <span>
                    ONLINE
                </span>

            </div>

        </header>


        <section class="content">

            <!-- ORB -->

            <div class="assistant-area">

                <div class="orb-wrapper">

                    <div class="orb-ring"></div>

                    <div
                        id="orb"
                        class="orb listening"
                    >

                        <img
                            src="{{ url_for('static', filename='aura-logo.png') }}"
                            alt="AURA"
                        >

                    </div>

                </div>


                <div
                    id="state"
                    class="state"
                >
                    Listening...
                </div>


                <div class="hint">
                    Speak naturally — AURA will listen automatically
                </div>

            </div>


            <!-- CHAT -->

            <div class="chat-panel">

                <div class="chat-header">

                    <h2>
                        Conversation
                    </h2>

                    <p>
                        Chat with AURA AI
                    </p>

                </div>


                <div
                    id="messages"
                    class="messages"
                >

                    <div class="message ai">
                        Hi! I'm AURA AI. I'm ready to help you.
                    </div>

                </div>


                <div class="input-area">

                    <div class="input-box">

                        <input
                            id="messageInput"
                            type="text"
                            placeholder="Ask AURA anything..."
                            autocomplete="off"
                        >


                        <button
                            id="micBtn"
                            class="icon-btn"
                            onclick="toggleVoice()"
                            title="Voice"
                        >
                            🎙
                        </button>


                        <button
                            class="icon-btn send-btn"
                            onclick="sendMessage()"
                            title="Send"
                        >
                            ➤
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<script>

    /* ================= ELEMENTS ================= */

    const orb =
        document.getElementById("orb");

    const stateText =
        document.getElementById("state");

    const messages =
        document.getElementById("messages");

    const input =
        document.getElementById("messageInput");

    const micBtn =
        document.getElementById("micBtn");


    /* ================= STATE ================= */

    let recognition = null;

    let voiceEnabled = true;

    let isListening = false;

    let isSpeaking = false;


    /* ================= UI STATE ================= */

    function setState(state) {

        orb.classList.remove(
            "listening",
            "thinking",
            "speaking"
        );


        if (state === "listening") {

            orb.classList.add("listening");

            stateText.textContent =
                "Listening...";

        }


        else if (state === "thinking") {

            orb.classList.add("thinking");

            stateText.textContent =
                "Thinking...";

        }


        else if (state === "speaking") {

            orb.classList.add("speaking");

            stateText.textContent =
                "Speaking...";

        }


        else {

            stateText.textContent =
                state;

        }

    }


    /* ================= MESSAGE ================= */

    function addMessage(text, type) {

        const div =
            document.createElement("div");

        div.className =
            "message " + type;

        div.textContent =
            text;

        messages.appendChild(div);

        messages.scrollTop =
            messages.scrollHeight;
    }


    /* ================= SEND ================= */

    async function sendMessage(text = null) {

        if (!text) {
            text = input.value.trim();
        }


        if (!text) {
            return;
        }


        input.value = "";

        addMessage(
            text,
            "user"
        );

        setState("thinking");


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: text
                        })
                    }
                );


            const data =
                await response.json();


            const reply =
                data.reply ||
                "Sorry, I couldn't generate a response.";


            addMessage(
                reply,
                "ai"
            );


            if (voiceEnabled) {

                speak(reply);

            }

            else {

                startListening();

            }

        }

        catch (error) {

            console.error(error);

            addMessage(
                "AURA AI se connection problem aa rahi hai.",
                "ai"
            );

            setState("Error");

            setTimeout(
                startListening,
                1500
            );

        }

    }


    /* ================= ENTER ================= */

    input.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );


    /* ================= VOICE OUTPUT ================= */

    function speak(text) {

        if (!("speechSynthesis" in window)) {

            startListening();

            return;

        }


        speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(text);


        const hasHindi =
            /[\u0900-\u097F]/.test(text);


        if (hasHindi) {

            utterance.lang =
                "hi-IN";

        }

        else {

            utterance.lang =
                "en-IN";

        }


        utterance.rate = 1;

        utterance.pitch = 1;


        utterance.onstart =
            function() {

                isSpeaking = true;

                setState("speaking");

            };


        utterance.onend =
            function() {

                isSpeaking = false;

                if (voiceEnabled) {

                    startListening();

                }
                else {

                    setState("Ready");

                }

            };


        utterance.onerror =
            function() {

                isSpeaking = false;

                startListening();

            };


        speechSynthesis.speak(
            utterance
        );

    }


    /* ================= SPEECH RECOGNITION ================= */

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (SpeechRecognition) {

        recognition =
            new SpeechRecognition();


        recognition.continuous =
            false;


        recognition.interimResults =
            false;


        recognition.lang =
            "en-IN";


        recognition.onstart =
            function() {

                isListening = true;

                setState("listening");

                micBtn.textContent =
                    "⏹";

            };


        recognition.onresult =
            function(event) {

                const transcript =
                    event
                        .results[0][0]
                        .transcript
                        .trim();


                if (transcript) {

                    sendMessage(
                        transcript
                    );

                }

            };


        recognition.onerror =
            function(event) {

                console.log(
                    "Speech error:",
                    event.error
                );


                isListening = false;


                if (
                    event.error ===
                    "not-allowed"
                ) {

                    setState(
                        "Microphone permission required"
                    );

                    return;

                }


                if (voiceEnabled) {

                    setTimeout(
                        startListening,
                        700
                    );

                }

            };


        recognition.onend =
            function() {

                isListening = false;

                micBtn.textContent =
                    "🎙";


                if (
                    voiceEnabled &&
                    !isSpeaking
                ) {

                    setTimeout(
                        startListening,
                        500
                    );

                }

            };

    }

    else {

        voiceEnabled = false;

        setState(
            "Use Chrome or Edge for voice"
        );

    }


    /* ================= START LISTENING ================= */

    function startListening() {

        if (!voiceEnabled) {
            return;
        }

        if (!recognition) {
            return;
        }

        if (isListening) {
            return;
        }

        if (isSpeaking) {
            return;
        }


        try {

            recognition.start();

        }

        catch (error) {

            console.log(
                "Recognition:",
                error
            );

        }

    }


    /* ================= TOGGLE VOICE ================= */

    function toggleVoice() {

        voiceEnabled =
            !voiceEnabled;


        if (!voiceEnabled) {

            if (recognition) {

                try {
                    recognition.stop();
                }

                catch (e) {}

            }


            speechSynthesis.cancel();


            isListening = false;

            isSpeaking = false;


            micBtn.textContent =
                "🎙";


            setState(
                "Voice Off"
            );

        }

        else {

            startListening();

        }

    }


    /* ================= NEW CHAT ================= */

    function newChat() {

        messages.innerHTML = `
            <div class="message ai">
                New conversation started.
                How can I help you?
            </div>
        `;

        input.focus();

    }


    /* ================= FOCUS CHAT ================= */

    function focusChat() {

        input.focus();

    }


    /* ================= START ================= */

    window.addEventListener(
        "load",
        function() {

            setTimeout(
                startListening,
                1200
            );

        }
    );

</script>

</body>
</html>
