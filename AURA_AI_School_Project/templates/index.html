<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at center, #171b3b 0%, #080a17 45%, #03040b 100%);
    color: white;
    overflow: hidden;
}

/* HEADER */

.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 24px;
    background: rgba(5, 7, 18, 0.75);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    z-index: 50;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand img {
    width: 48px;
    height: 48px;
    object-fit: contain;
}

.brand-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
}

.brand-sub {
    font-size: 11px;
    color: #9ca3c7;
    margin-top: 3px;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #8df5b0;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #35f27b;
    box-shadow: 0 0 12px #35f27b;
}

/* MAIN */

.main {
    position: absolute;
    top: 72px;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

.center {
    text-align: center;
    margin-bottom: 30px;
}

.orb {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    margin: auto;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;

    background:
        radial-gradient(circle,
        #ffffff 0%,
        #8c7cff 8%,
        #543dff 22%,
        #21175c 52%,
        #080a17 72%);

    box-shadow:
        0 0 30px #635bff,
        0 0 80px rgba(99,91,255,0.55),
        inset 0 0 45px rgba(255,255,255,0.25);

    animation: idle 3s ease-in-out infinite;
}

.orb::before {
    content: "";
    position: absolute;
    width: 245px;
    height: 245px;
    border-radius: 50%;
    border: 2px solid rgba(113, 96, 255, 0.5);
    animation: rotate 7s linear infinite;
}

.orb::after {
    content: "";
    position: absolute;
    width: 275px;
    height: 275px;
    border-radius: 50%;
    border: 1px solid rgba(92, 230, 255, 0.25);
    animation: rotateReverse 10s linear infinite;
}

.orb.listening {
    animation: listening 1.2s ease-in-out infinite;
}

.orb.thinking {
    animation: thinking 0.65s ease-in-out infinite;
}

.orb.speaking {
    animation: speaking 0.45s ease-in-out infinite;
}

@keyframes idle {
    0%,100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.04);
    }
}

@keyframes listening {
    0%,100% {
        transform: scale(1);
        box-shadow:
            0 0 30px #635bff,
            0 0 70px rgba(99,91,255,0.5);
    }

    50% {
        transform: scale(1.1);
        box-shadow:
            0 0 45px #6dffff,
            0 0 110px rgba(64,220,255,0.65);
    }
}

@keyframes thinking {
    0%,100% {
        transform: scale(0.96);
    }

    50% {
        transform: scale(1.08);
    }
}

@keyframes speaking {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.13);
    }
}

@keyframes rotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotateReverse {
    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

.orb-text {
    position: relative;
    z-index: 2;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 5px;
}

.state {
    margin-top: 35px;
    font-size: 17px;
    color: #b9bde0;
}

.hint {
    margin-top: 10px;
    font-size: 12px;
    color: #6f7398;
}

.mic-status {
    margin-top: 18px;
    color: #8f95c2;
    font-size: 13px;
}

/* CHAT */

.chat-panel {
    position: fixed;
    right: 20px;
    top: 90px;
    bottom: 90px;
    width: 380px;

    display: flex;
    flex-direction: column;

    background: rgba(10, 12, 28, 0.96);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;

    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);

    overflow: hidden;
    z-index: 100;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}

.chat-panel.hidden {
    opacity: 0;
    transform: translateX(40px);
    pointer-events: none;
}

.chat-header {
    height: 58px;
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 15px;

    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.chat-title {
    font-weight: 700;
}

.chat-title small {
    display: block;
    font-size: 10px;
    color: #777c9e;
    margin-top: 3px;
}

.hide-btn {
    border: 0;
    background: rgba(255,255,255,0.08);
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
}

.hide-btn:hover {
    background: rgba(255,255,255,0.15);
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
}

.messages::-webkit-scrollbar {
    width: 5px;
}

.messages::-webkit-scrollbar-thumb {
    background: #363b66;
    border-radius: 10px;
}

.message {
    max-width: 88%;
    padding: 11px 13px;
    margin-bottom: 12px;
    border-radius: 13px;
    line-height: 1.5;
    font-size: 14px;
    word-wrap: break-word;
}

.message.user {
    margin-left: auto;
    background: linear-gradient(135deg,#555cff,#783fff);
    border-bottom-right-radius: 4px;
}

.message.ai {
    margin-right: auto;
    background: rgba(255,255,255,0.07);
    border-bottom-left-radius: 4px;
}

/* MARKDOWN */

.message strong {
    font-weight: 800;
    color: white;
}

.message em {
    color: #cdd1ff;
}

.message code {
    background: rgba(0,0,0,0.35);
    padding: 2px 5px;
    border-radius: 5px;
    font-family: Consolas, monospace;
}

.message pre {
    background: #05060d;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 12px;
    border-radius: 9px;
    overflow-x: auto;
    margin: 9px 0;
}

.message pre code {
    background: none;
    padding: 0;
}

.message a {
    color: #7edcff;
    text-decoration: underline;
}

/* INPUT */

.chat-input-area {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
}

.chat-input {
    flex: 1;
    min-width: 0;

    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: white;

    border-radius: 10px;
    padding: 12px;

    outline: none;
    font-size: 14px;
}

.chat-input:focus {
    border-color: #646cff;
}

.send-btn {
    width: 48px;
    border: 0;
    border-radius: 10px;

    background: linear-gradient(135deg,#5964ff,#873fff);
    color: white;

    font-size: 18px;
    cursor: pointer;
}

.send-btn:hover {
    filter: brightness(1.15);
}

.send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* SHOW CHAT */

.show-chat-btn {
    position: fixed;
    right: 20px;
    bottom: 22px;

    display: none;

    padding: 11px 16px;

    border: 0;
    border-radius: 10px;

    background: linear-gradient(135deg,#5865f2,#914fff);
    color: white;

    font-weight: 700;
    cursor: pointer;

    z-index: 200;
}

.show-chat-btn.visible {
    display: block;
}

/* FOOTER */

.footer {
    position: fixed;
    left: 20px;
    bottom: 20px;
    color: #666b91;
    font-size: 11px;
}

/* MOBILE */

@media (max-width: 700px) {

    .header {
        padding: 10px 14px;
    }

    .brand-title {
        font-size: 18px;
    }

    .orb {
        width: 170px;
        height: 170px;
    }

    .orb::before {
        width: 195px;
        height: 195px;
    }

    .orb::after {
        width: 220px;
        height: 220px;
    }

    .chat-panel {
        left: 10px;
        right: 10px;
        top: 82px;
        bottom: 10px;
        width: auto;
    }

    .footer {
        display: none;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

    <div class="brand">

        <img
            src="{{ url_for('static', filename='aura-logo.png') }}"
            alt="AURA AI"
        >

        <div>
            <div class="brand-title">AURA AI</div>
            <div class="brand-sub">YOUR AI ASSISTANT</div>
        </div>

    </div>

    <div class="status">
        <span class="status-dot"></span>
        ONLINE
    </div>

</header>


<!-- MAIN -->

<main class="main">

    <div class="center">

        <div id="orb" class="orb">
            <div class="orb-text">AURA</div>
        </div>

        <div id="state" class="state">
            Starting AURA...
        </div>

        <div class="hint">
            Speak naturally — AURA will listen automatically
        </div>

        <div id="micStatus" class="mic-status">
            Microphone initializing...
        </div>

    </div>

</main>


<!-- CHAT -->

<section id="chatPanel" class="chat-panel">

    <div class="chat-header">

        <div class="chat-title">
            AURA CHAT
            <small>Talk with AURA AI</small>
        </div>

        <button
            id="hideChatBtn"
            class="hide-btn"
            type="button"
        >
            Hide
        </button>

    </div>


    <div id="messages" class="messages">

        <div class="message ai">
            Hey! 👋 I'm AURA AI.<br>
            You can type here or speak naturally.
        </div>

    </div>


    <div class="chat-input-area">

        <input
            id="chatInput"
            class="chat-input"
            type="text"
            autocomplete="off"
            placeholder="Type a message..."
        >

        <button
            id="sendBtn"
            class="send-btn"
            type="button"
            title="Send"
        >
            ➤
        </button>

    </div>

</section>


<button
    id="showChatBtn"
    class="show-chat-btn"
    type="button"
>
    💬 Show Chat
</button>


<div class="footer">
    Made by JLPG
</div>


<script>

/* =========================
   ELEMENTS
========================= */

const orb = document.getElementById("orb");
const state = document.getElementById("state");
const micStatus = document.getElementById("micStatus");

const chatPanel = document.getElementById("chatPanel");
const hideChatBtn = document.getElementById("hideChatBtn");
const showChatBtn = document.getElementById("showChatBtn");

const messages = document.getElementById("messages");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");


/* =========================
   STATE
========================= */

let isSpeaking = false;
let isProcessing = false;
let recognition = null;
let recognitionRunning = false;

let restartListening = true;


/* =========================
   ORB
========================= */

function setState(type, text) {

    orb.classList.remove(
        "listening",
        "thinking",
        "speaking"
    );

    if (type) {
        orb.classList.add(type);
    }

    state.textContent = text;
}


/* =========================
   CHAT TOGGLE
========================= */

function hideChat() {

    chatPanel.classList.add("hidden");
    showChatBtn.classList.add("visible");

}

function showChat() {

    chatPanel.classList.remove("hidden");
    showChatBtn.classList.remove("visible");

}

hideChatBtn.addEventListener("click", hideChat);
showChatBtn.addEventListener("click", showChat);


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   MARKDOWN
========================= */

function markdownToHTML(text) {

    let html = escapeHTML(text);

    const codeBlocks = [];

    html = html.replace(
        /```([\s\S]*?)```/g,
        function(match, code) {

            const index = codeBlocks.length;

            codeBlocks.push(
                "<pre><code>" +
                code.trim() +
                "</code></pre>"
            );

            return "___CODEBLOCK_" + index + "___";
        }
    );

    html = html.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
    );

    html = html.replace(
        /\*\*([^*]+)\*\*/g,
        "<strong>$1</strong>"
    );

    html = html.replace(
        /__([^_]+)__/g,
        "<strong>$1</strong>"
    );

    html = html.replace(
        /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
        "<em>$1</em>"
    );

    html = html.replace(
        /^### (.+)$/gm,
        "<strong>$1</strong>"
    );

    html = html.replace(
        /^## (.+)$/gm,
        "<strong>$1</strong>"
    );

    html = html.replace(
        /^# (.+)$/gm,
        "<strong>$1</strong>"
    );

    html = html.replace(
        /(https?:\/\/[^\s<]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
    );

    html = html.replace(
        /\n/g,
        "<br>"
    );

    codeBlocks.forEach(function(code, index) {

        html = html.replace(
            "___CODEBLOCK_" + index + "___",
            code
        );

    });

    return html;

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    if (type === "ai") {
        div.innerHTML = markdownToHTML(text);
    } else {
        div.textContent = text;
    }

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(message = null) {

    if (isProcessing) {
        return;
    }

    const text = (
        message !== null
        ? message
        : chatInput.value
    ).trim();

    if (!text) {
        return;
    }

    chatInput.value = "";

    addMessage(text, "user");

    isProcessing = true;

    sendBtn.disabled = true;

    setState(
        "thinking",
        "Thinking..."
    );

    try {

        const response = await fetch(
            "/api/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: text
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.reply || "Server error"
            );

        }

        const reply =
            data.reply ||
            "Sorry, I didn't get a response.";

        addMessage(reply, "ai");

        speak(reply);

    } catch (error) {

        console.error(
            "CHAT ERROR:",
            error
        );

        const errorText =
            "Sorry, AURA se response lene mein problem aa rahi hai.";

        addMessage(
            errorText,
            "ai"
        );

        setState(
            "error",
            "Connection problem"
        );

        isProcessing = false;
        sendBtn.disabled = false;

    }

}


/* =========================
   BUTTON
========================= */

sendBtn.addEventListener(
    "click",
    function() {

        sendMessage();

    }
);


/* =========================
   ENTER
========================= */

chatInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   SPEECH SYNTHESIS
========================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        isProcessing = false;
        sendBtn.disabled = false;

        startListening();

        return;

    }

    window.speechSynthesis.cancel();

    isSpeaking = true;

    setState(
        "speaking",
        "AURA is speaking..."
    );

    const utterance =
        new SpeechSynthesisUtterance(text);

    const hasHindi =
        /[\u0900-\u097F]/.test(text);

    if (hasHindi) {

        utterance.lang = "hi-IN";

    } else {

        utterance.lang = "en-IN";

    }

    utterance.rate = 1;
    utterance.pitch = 1;

    utterance.onend = function() {

        isSpeaking = false;
        isProcessing = false;

        sendBtn.disabled = false;

        setState(
            "listening",
            "Listening..."
        );

        if (restartListening) {
            startListening();
        }

    };

    utterance.onerror = function() {

        isSpeaking = false;
        isProcessing = false;

        sendBtn.disabled = false;

        startListening();

    };

    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================
   SPEECH RECOGNITION
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.lang = "en-IN";

    recognition.onstart = function() {

        recognitionRunning = true;

        micStatus.textContent =
            "🎙️ Listening...";

        if (
            !isSpeaking &&
            !isProcessing
        ) {

            setState(
                "listening",
                "Listening..."
            );

        }

    };


    recognition.onresult = function(event) {

        const transcript =
            event.results[0][0].transcript.trim();

        if (!transcript) {
            return;
        }

        console.log(
            "VOICE:",
            transcript
        );

        recognitionRunning = false;

        sendMessage(transcript);

    };


    recognition.onerror = function(event) {

        console.log(
            "Speech recognition:",
            event.error
        );

        recognitionRunning = false;

        if (
            event.error === "not-allowed" ||
            event.error === "service-not-allowed"
        ) {

            micStatus.textContent =
                "🎙️ Microphone permission required";

            setState(
                "",
                "Allow microphone access"
            );

            return;

        }

        if (!isSpeaking && !isProcessing) {

            micStatus.textContent =
                "🎙️ Listening will restart...";

            setTimeout(
                startListening,
                800
            );

        }

    };


    recognition.onend = function() {

        recognitionRunning = false;

        if (
            restartListening &&
            !isSpeaking &&
            !isProcessing
        ) {

            setTimeout(
                startListening,
                500
            );

        }

    };

} else {

    micStatus.textContent =
        "🎙️ Speech recognition is not supported in this browser.";

    setState(
        "",
        "Use chat to talk with AURA"
    );

}


/* =========================
   START LISTENING
========================= */

function startListening() {

    if (!recognition) {
        return;
    }

    if (recognitionRunning) {
        return;
    }

    if (isSpeaking || isProcessing) {
        return;
    }

    try {

        recognition.lang = "en-IN";

        recognition.start();

    } catch (error) {

        console.log(
            "Recognition start:",
            error
        );

    }

}


/* =========================
   STOP LISTENING
========================= */

function stopListening() {

    if (!recognition) {
        return;
    }

    try {

        recognition.stop();

    } catch (error) {

        console.log(error);

    }

}


/* =========================
   INITIALIZE
========================= */

window.addEventListener(
    "load",
    function() {

        setState(
            "",
            "Starting microphone..."
        );

        setTimeout(
            function() {

                if (recognition) {

                    startListening();

                } else {

                    setState(
                        "",
                        "Ready"
                    );

                }

            },
            1000
        );

    }
);

</script>

</body>
</html>
