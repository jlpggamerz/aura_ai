<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AURA AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, #18205c 0%, transparent 35%),
                radial-gradient(circle at bottom right, #40145c 0%, transparent 35%),
                #070812;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        /* =========================
           MAIN APP
        ========================= */

        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 250px;
            background: rgba(8, 10, 25, 0.92);
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: 25px 18px;
            display: flex;
            flex-direction: column;
        }

        .brand {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand img {
            width: 105px;
            height: 105px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .brand-name {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .brand-subtitle {
            font-size: 11px;
            color: #a9aec8;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .menu-title {
            font-size: 11px;
            color: #777c9a;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 10px 10px;
        }

        .menu-btn {
            width: 100%;
            padding: 13px 14px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: #c9cce0;
            text-align: left;
            cursor: pointer;
            margin-bottom: 7px;
            font-size: 14px;
            transition: 0.2s;
        }

        .menu-btn:hover {
            background: rgba(255,255,255,0.07);
            color: white;
        }

        .menu-btn.active {
            background: linear-gradient(
                90deg,
                rgba(80, 110, 255, 0.25),
                rgba(155, 75, 255, 0.18)
            );
            color: white;
        }

        .sidebar-bottom {
            margin-top: auto;
            text-align: center;
            color: #7e829d;
            font-size: 12px;
            line-height: 1.7;
        }

        .jlpg {
            color: #b8bdff;
            font-weight: 700;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {
            height: 70px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            background: rgba(7,8,18,0.55);
            backdrop-filter: blur(15px);
        }

        .top-title {
            font-size: 17px;
            font-weight: 700;
        }

        .online {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: #9da2c0;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #55e69a;
            box-shadow: 0 0 12px #55e69a;
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* =========================
           ORB
        ========================= */

        .orb-area {
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .orb {
            width: 145px;
            height: 145px;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle,
                    rgba(122, 104, 255, 0.55),
                    rgba(40, 45, 130, 0.2) 55%,
                    transparent 70%
                );

            border: 1px solid rgba(140,150,255,0.4);

            box-shadow:
                0 0 35px rgba(86, 100, 255, 0.5),
                inset 0 0 35px rgba(120, 100, 255, 0.25);

            transition: 0.3s;
        }

        .orb img {
            width: 82px;
            height: 82px;
            object-fit: contain;
            z-index: 2;
        }

        .orb::before,
        .orb::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(110,120,255,0.25);
        }

        .orb::before {
            width: 175px;
            height: 175px;
        }

        .orb::after {
            width: 205px;
            height: 205px;
            border-color: rgba(160,90,255,0.12);
        }

        .orb.listening {
            animation: listenPulse 1.5s infinite;
        }

        .orb.thinking {
            animation: thinkPulse 0.8s infinite;
        }

        .orb.speaking {
            animation: speakPulse 0.7s infinite;
        }

        @keyframes listenPulse {

            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }
        }

        @keyframes thinkPulse {

            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        @keyframes speakPulse {

            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.16);
            }
        }

        .status {
            margin-top: 32px;
            font-size: 13px;
            color: #9ca2c5;
        }

        /* =========================
           CHAT
        ========================= */

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px 8%;
            scroll-behavior: smooth;
        }

        .chat::-webkit-scrollbar {
            width: 5px;
        }

        .chat::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.12);
            border-radius: 10px;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 78%;
            padding: 13px 16px;
            border-radius: 16px;
            line-height: 1.55;
            font-size: 14px;
            word-wrap: break-word;
        }

        .message.ai .bubble {
            background: rgba(255,255,255,0.055);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .message.user .bubble {
            background: linear-gradient(
                135deg,
                #5865f2,
                #8a4dff
            );
        }

        /* =========================
           MARKDOWN
        ========================= */

        .bubble strong {
            font-weight: 800;
            color: #ffffff;
        }

        .bubble em {
            font-style: italic;
            color: #e0ddff;
        }

        .bubble h1,
        .bubble h2,
        .bubble h3 {
            margin: 10px 0 8px;
            line-height: 1.3;
            color: white;
        }

        .bubble h1 {
            font-size: 22px;
        }

        .bubble h2 {
            font-size: 19px;
        }

        .bubble h3 {
            font-size: 16px;
        }

        .bubble code {
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 2px 6px;
            border-radius: 5px;
            font-family: Consolas, monospace;
            font-size: 13px;
        }

        .bubble pre {
            background: #080a12;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 14px;
            margin: 10px 0;
            overflow-x: auto;
            white-space: pre;
        }

        .bubble pre code {
            background: transparent;
            border: none;
            padding: 0;
            color: #e6e8ff;
        }

        .bubble ul {
            margin: 8px 0 8px 20px;
        }

        .bubble li {
            margin: 4px 0;
        }

        .bubble a {
            color: #aeb7ff;
        }

        /* =========================
           INPUT
        ========================= */

        .input-area {
            padding: 18px 8% 22px;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 9px;
            background: rgba(17,19,36,0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 12px;
            font-size: 14px;
            min-width: 0;
        }

        .input-box input::placeholder {
            color: #686d88;
        }

        .icon-btn {
            width: 43px;
            height: 43px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            color: #d8dbed;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255,255,255,0.12);
        }

        .send-btn {
            background: linear-gradient(
                135deg,
                #5b6cff,
                #914fff
            );
            color: white;
        }

        .send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 20px rgba(105,90,255,0.3);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 750px) {

            .sidebar {
                display: none;
            }

            .topbar {
                padding: 0 15px;
            }

            .orb-area {
                height: 245px;
            }

            .orb {
                width: 115px;
                height: 115px;
            }

            .orb img {
                width: 65px;
                height: 65px;
            }

            .orb::before {
                width: 140px;
                height: 140px;
            }

            .orb::after {
                width: 165px;
                height: 165px;
            }

            .chat {
                padding: 10px 15px;
            }

            .input-area {
                padding: 10px 12px 15px;
            }

            .bubble {
                max-width: 90%;
            }
        }

    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="brand">

            <img
                src="{{ url_for('static', filename='aura-logo.png') }}"
                alt="AURA AI"
            >

            <div class="brand-name">
                AURA AI
            </div>

            <div class="brand-subtitle">
                YOUR AI ASSISTANT
            </div>

        </div>

        <div class="menu-title">
            Workspace
        </div>

        <button class="menu-btn active">
            ✦ &nbsp; Assistant
        </button>

        <button
            class="menu-btn"
            onclick="newChat()"
        >
            ＋ &nbsp; New Chat
        </button>

        <button
            class="menu-btn"
            onclick="startVoice()"
        >
            ◉ &nbsp; Voice Mode
        </button>

        <div class="sidebar-bottom">

            <div>
                AURA AI
            </div>

            <div class="jlpg">
                Made by JLPG
            </div>

        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

        <header class="topbar">

            <div class="top-title">
                AURA Assistant
            </div>

            <div class="online">

                <span class="online-dot"></span>

                ONLINE

            </div>

        </header>


        <section class="content">


            <!-- =========================
                 ORB
            ========================= -->

            <div class="orb-area">

                <div
                    id="orb"
                    class="orb"
                >

                    <img
                        src="{{ url_for('static', filename='aura-logo.png') }}"
                        alt="AURA"
                    >

                </div>

                <div
                    id="status"
                    class="status"
                >
                    Ready
                </div>

            </div>


            <!-- =========================
                 CHAT
            ========================= -->

            <div
                id="chat"
                class="chat"
            >

                <div class="message ai">

                    <div class="bubble">

                        <strong>AURA AI</strong>
                        <br><br>

                        Hello! 👋
                        <br>
                        I'm AURA AI. How can I help you?

                    </div>

                </div>

            </div>


            <!-- =========================
                 INPUT
            ========================= -->

            <div class="input-area">

                <div class="input-box">

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Ask AURA anything..."
                        autocomplete="off"
                    >

                    <button
                        id="micBtn"
                        class="icon-btn"
                        onclick="startVoice()"
                        title="Voice"
                    >
                        🎤
                    </button>

                    <button
                        class="icon-btn send-btn"
                        onclick="sendMessage()"
                        title="Send"
                    >
                        ➤
                    </button>

                </div>

            </div>

        </section>

    </main>

</div>


<script>

    /* ==========================================
       ELEMENTS
    ========================================== */

    const chat =
        document.getElementById("chat");

    const input =
        document.getElementById("messageInput");

    const orb =
        document.getElementById("orb");

    const statusText =
        document.getElementById("status");

    const micBtn =
        document.getElementById("micBtn");


    /* ==========================================
       MARKDOWN FORMATTER
    ========================================== */

    function formatAIText(text) {

        if (!text) {
            return "";
        }

        /*
         * Escape HTML
         */

        text = text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");


        /*
         * CODE BLOCKS
         */

        text = text.replace(
            /```(?:\w+)?\n?([\s\S]*?)```/g,
            function(match, code) {

                return "<pre><code>" +
                    code.trim() +
                    "</code></pre>";

            }
        );


        /*
         * INLINE CODE
         */

        text = text.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );


        /*
         * BOLD
         *
         * **Python**
         */

        text = text.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


        /*
         * ITALIC
         *
         * *Python*
         */

        text = text.replace(
            /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
            "<em>$1</em>"
        );


        /*
         * HEADINGS
         */

        text = text.replace(
            /^### (.*)$/gm,
            "<h3>$1</h3>"
        );

        text = text.replace(
            /^## (.*)$/gm,
            "<h2>$1</h2>"
        );

        text = text.replace(
            /^# (.*)$/gm,
            "<h1>$1</h1>"
        );


        /*
         * BULLETS
         */

        text = text.replace(
            /^[•-] (.*)$/gm,
            "<li>$1</li>"
        );


        /*
         * NUMBERED LIST
         */

        text = text.replace(
            /^\d+\.\s+(.*)$/gm,
            "<li>$1</li>"
        );


        /*
         * LINKS
         */

        text = text.replace(
            /(https?:\/\/[^\s<]+)/g,
            '<a href="$1" target="_blank">$1</a>'
        );


        /*
         * NEW LINES
         */

        text = text.replace(
            /\n/g,
            "<br>"
        );


        return text;
    }


    /* ==========================================
       ADD MESSAGE
    ========================================== */

    function addMessage(
        text,
        type = "ai"
    ) {

        const message =
            document.createElement("div");

        message.className =
            "message " + type;


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";


        if (type === "ai") {

            bubble.innerHTML =
                formatAIText(text);

        } else {

            /*
             * User text should remain plain text
             */

            bubble.textContent =
                text;

        }


        message.appendChild(bubble);

        chat.appendChild(message);


        /*
         * Scroll down
         */

        chat.scrollTop =
            chat.scrollHeight;
    }


    /* ==========================================
       STATUS
    ========================================== */

    function setStatus(
        text,
        state = ""
    ) {

        statusText.textContent =
            text;

        orb.classList.remove(
            "listening",
            "thinking",
            "speaking"
        );

        if (state) {

            orb.classList.add(
                state
            );

        }
    }


    /* ==========================================
       SEND MESSAGE
    ========================================== */

    async function sendMessage(
        customMessage = null
    ) {

        const message =
            customMessage !== null
                ? customMessage.trim()
                : input.value.trim();


        if (!message) {
            return;
        }


        /*
         * Show user message
         */

        addMessage(
            message,
            "user"
        );


        input.value = "";


        /*
         * Thinking
         */

        setStatus(
            "Thinking...",
            "thinking"
        );


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })
                    }
                );


            const data =
                await response.json();


            const reply =
                data.reply ||
                "Sorry, I couldn't generate a response.";


            /*
             * AI message
             */

            addMessage(
                reply,
                "ai"
            );


            /*
             * Speak answer
             */

            speak(reply);

        }

        catch (error) {

            console.error(
                "AURA ERROR:",
                error
            );


            addMessage(
                "Sorry, something went wrong while connecting to AURA AI.",
                "ai"
            );


            setStatus(
                "Connection error"
            );

        }

    }


    /* ==========================================
       ENTER KEY
    ========================================== */

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* ==========================================
       TEXT TO SPEECH
    ========================================== */

    function speak(text) {

        if (
            !("speechSynthesis" in window)
        ) {

            setStatus(
                "Ready"
            );

            startVoice();

            return;
        }


        /*
         * Stop previous speech
         */

        speechSynthesis.cancel();


        const cleanText =
            text
                .replace(/```[\s\S]*?```/g, "")
                .replace(/[*#`]/g, "");


        const utterance =
            new SpeechSynthesisUtterance(
                cleanText
            );


        /*
         * Detect Hindi
         */

        const hasHindi =
            /[\u0900-\u097F]/.test(
                cleanText
            );


        if (hasHindi) {

            utterance.lang =
                "hi-IN";

        } else {

            utterance.lang =
                "en-IN";

        }


        utterance.rate =
            1;

        utterance.pitch =
            1;


        utterance.onstart =
            function() {

                setStatus(
                    "AURA is speaking...",
                    "speaking"
                );

            };


        utterance.onend =
            function() {

                setStatus(
                    "Listening..."
                );

                /*
                 * Automatically listen again
                 */

                setTimeout(
                    function() {

                        startVoice();

                    },
                    500
                );

            };


        utterance.onerror =
            function() {

                setStatus(
                    "Ready"
                );

                setTimeout(
                    function() {

                        startVoice();

                    },
                    500
                );

            };


        speechSynthesis.speak(
            utterance
        );

    }


    /* ==========================================
       SPEECH RECOGNITION
    ========================================== */

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    let recognition = null;

    let isListening = false;


    if (SpeechRecognition) {

        recognition =
            new SpeechRecognition();


        recognition.continuous =
            false;


        recognition.interimResults =
            false;


        recognition.lang =
            "en-IN";


        recognition.onstart =
            function() {

                isListening =
                    true;

                setStatus(
                    "Listening...",
                    "listening"
                );

                micBtn.textContent =
                    "🔴";

            };


        recognition.onresult =
            function(event) {

                const transcript =
                    event
                        .results[0][0]
                        .transcript
                        .trim();


                if (!transcript) {
                    return;
                }


                input.value =
                    transcript;


                /*
                 * Send automatically
                 */

                sendMessage(
                    transcript
                );

            };


        recognition.onerror =
            function(event) {

                console.log(
                    "Speech error:",
                    event.error
                );

                isListening =
                    false;

                micBtn.textContent =
                    "🎤";


                /*
                 * Don't show annoying
                 * errors for silence
                 */

                if (
                    event.error ===
                    "not-allowed"
                ) {

                    setStatus(
                        "Microphone permission required"
                    );

                } else {

                    setStatus(
                        "Ready"
                    );

                }

            };


        recognition.onend =
            function() {

                isListening =
                    false;

                micBtn.textContent =
                    "🎤";

            };

    }


    /* ==========================================
       START VOICE
    ========================================== */

    function startVoice() {

        if (!recognition) {

            setStatus(
                "Voice is not supported in this browser"
            );

            return;
        }


        if (isListening) {
            return;
        }


        try {

            recognition.start();

        }

        catch (error) {

            console.log(
                "Voice start error:",
                error
            );

        }

    }


    /* ==========================================
       NEW CHAT
    ========================================== */

    function newChat() {

        chat.innerHTML = `
            <div class="message ai">
                <div class="bubble">
                    <strong>AURA AI</strong>
                    <br><br>
                    New conversation started. 👋
                    <br>
                    How can I help you?
                </div>
            </div>
        `;


        input.value = "";

        setStatus(
            "Ready"
        );

    }


    /* ==========================================
       INITIAL STATE
    ========================================== */

    setStatus(
        "Ready"
    );


</script>

</body>
</html>
